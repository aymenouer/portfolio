@let skillsText = portfolio().text.skills;
<section class="scene knowledge-scene section-padding" id="knowledge">
  <app-scene-heading class="reveal" [label]="skillsText.sceneLabel" [tagline]="skillsText.sceneTagline" />

  <div class="knowledge-top reveal">
    <div><p class="eyebrow">{{ skillsText.eyebrow }}</p><h2>{{ skillsText.title.firstLine }}<br><em>{{ skillsText.title.highlightedLine }}</em></h2></div>
    <p>{{ skillsText.intro }}</p>
  </div>

  <div class="skill-list">
    @for (skillGroup of portfolio().skillGroups; track skillGroup.name) {
      <app-skill-row class="reveal" [skillGroup]="skillGroup" />
    }
  </div>
</section>
